name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Aieda1l/ECC'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge affaan-m/ECC main
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/affaan-m/ECC.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains upstream/main."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve fork-only commits. A real conflict fails the workflow instead
          # of force-resetting main or silently discarding custom ECC changes.
          git merge --no-edit upstream/main
          git push origin HEAD:main
